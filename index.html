<!DOCTYPE html>
<html>

    <head>
        <title>Semaforo</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <div class="container">

            <div class="counting">
                <h2>Contador de colores</h2>
                <p class="chgR" id="chgRed">0</p>
                <p class="chgY" id="chgYellow">0</p>
                <p class="chgG" id="chgGreen">0</p>
            </div>


            <div class="traffic-light">
                <div class="lightR" id="red"></div>
                <div class="lightY" id="yellow"></div>
                <div class="lightG" id="green"></div>
            </div>


            <div class="controls">
                <h2>Modo automático</h2>
                <button class="btnA" id="btnAutomatico">Cambiar color</button>

                <h2>Modo manual</h2>
                <button class="btnR" id="btnRed">Cambiar a rojo</button>
                <button class="btnY" id="btnYellow">Cambiar a amarillo</button>
                <button class="btnG" id="btnGreen">Cambiar a verde</button>
                <button class="btnO" id="btnOff">Apagar</button>

                <script src="js/script.js"></script>
            </div>

        </div>   
    </body>

</html>
