<!DOCTYPE html>
<html>

    <head>
        <title>Semaforo</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <div class="traffic-light">
            <div class="lightR" id="rojo"></div>
            <div class="lightY" id="amarillo"></div>
            <div class="lightG" id="verde"></div>
        </div>

        <div class="controls">
            <h2>Modo automático</h2>
            <button class="btnA" id="btnAutomatico">Cambiar color</button>

            <h2>Modo manual</h2>
            <button class="btnR" id="btnRojo">Cambiar a rojo</button>
            <button class="btnY" id="btnAmarillo">Cambiar a amarillo</button>
            <button class="btnG" id="btnVerde">Cambiar a verde</button>
            <button class="btnO" id="btnApagar">Apagar</button>

            <script src="js/script.js"></script>
        </div>
    </body>

</html>
